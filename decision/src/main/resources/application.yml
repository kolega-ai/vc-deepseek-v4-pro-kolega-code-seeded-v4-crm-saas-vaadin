server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: decision
  datasource:
    url: ${DECISION_DB_URL:jdbc:postgresql://localhost:5432/crm_decision}
    username: ${DECISION_DB_USER:crmops}
    password: ${DECISION_DB_PASSWORD:crmops}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  # Local-development defaults only; docker compose overrides every one of these.
  # In a real deployment these are injected from a secret store.
  channel-service-token: ${DECISION_CHANNEL_SERVICE_TOKEN:dev-channel-service-token-not-for-prod}
  core-token-secret: ${DECISION_CORE_TOKEN_SECRET:dev-core-token-secret-0000000000000000}
  session-token-secret: ${DECISION_SESSION_TOKEN_SECRET:dev-session-token-secret-00000000000}
  session-token-ttl-minutes: ${DECISION_SESSION_TTL_MINUTES:480}
  scope-token-ttl-minutes: ${DECISION_SCOPE_TTL_MINUTES:5}

logging:
  level:
    root: INFO
    com.crmops.decision: INFO
