server:
  port: 8082
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: core-mock
  datasource:
    url: ${CORE_DB_URL:jdbc:postgresql://localhost:5432/crm_core}
    username: ${CORE_DB_USER:crmops}
    password: ${CORE_DB_PASSWORD:crmops}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  # Local-development defaults only; docker compose overrides every one of these.
  core-service-key: ${CORE_SERVICE_KEY:dev-core-service-key-not-for-prod}
  scope-token-secret: ${CORE_SCOPE_TOKEN_SECRET:dev-core-token-secret-0000000000000000}
  rate-limit-per-minute: ${CORE_RATE_LIMIT_PER_MINUTE:120}

logging:
  level:
    root: INFO
    com.crmops.coremock: INFO
